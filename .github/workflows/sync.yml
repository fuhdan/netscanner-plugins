name: Sync plugins to netscanner

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tests/test_plugin_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate before sync
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install bandit pytest ruff -q

      - name: Security scan
        run: bandit -r plugins/ -ll

      - name: Lint
        run: ruff check plugins/ tests/

      - name: Clone netscanner
        run: git clone --depth=1 https://github.com/fuhdan/netscanner.git netscanner-workspace

      - name: Install plugins into netscanner
        run: |
          cp plugins/__init__.py netscanner-workspace/plugins/
          cp plugins/*.py netscanner-workspace/plugins/
          for f in plugins/*.md; do
            [ -f "$f" ] && cp "$f" netscanner-workspace/plugins/
          done
          cp tests/test_plugin_*.py netscanner-workspace/tests/

      - name: Verify plugin discovery
        run: python3 netscanner-workspace/netscanner.py --list-protocols

      - name: Run full test suite
        run: python3 -m pytest netscanner-workspace/tests/ -v

  sync:
    name: Open sync pull request on netscanner
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Clone netscanner
        env:
          GH_TOKEN: ${{ secrets.NETSCANNER_PAT }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/fuhdan/netscanner.git" \
            netscanner-repo

      - name: Mirror plugin files
        run: |
          # Remove first, then copy: this makes a plugin deleted or renamed here
          # disappear there too, instead of living on unnoticed.
          rm -f netscanner-repo/plugins/*.py \
                netscanner-repo/plugins/*.md \
                netscanner-repo/tests/test_plugin_*.py
          cp plugins/__init__.py netscanner-repo/plugins/
          cp plugins/*.py netscanner-repo/plugins/
          for f in plugins/*.md; do
            [ -f "$f" ] && cp "$f" netscanner-repo/plugins/
          done
          cp tests/test_plugin_*.py netscanner-repo/tests/

      - name: Open pull request and queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.NETSCANNER_PAT }}
        run: |
          cd netscanner-repo
          git config user.name "netscanner-sync"
          git config user.email "github-actions@github.com"

          git add -A plugins/ tests/
          if git diff --cached --quiet; then
            echo "No plugin changes — nothing to sync."
            exit 0
          fi

          SHORT="${GITHUB_SHA:0:7}"
          BRANCH="sync/plugins-${SHORT}"
          SRC="https://github.com/fuhdan/netscanner-plugins/commit/${GITHUB_SHA}"

          git checkout -b "$BRANCH"
          git commit \
            -m "sync: update plugins from netscanner-plugins" \
            -m "Source: fuhdan/netscanner-plugins@${GITHUB_SHA}"
          git push origin "$BRANCH"

          printf '%s\n' \
            "Automated sync from [netscanner-plugins@\`${SHORT}\`](${SRC})." \
            "" \
            "Verified in netscanner-plugins before this pull request was opened:" \
            "\`bandit -r plugins/ -ll\`, plugin discovery via \`--list-protocols\`," \
            "and the full test suite on Python 3.9, 3.11 and 3.12 against this" \
            "repository's \`main\`." \
            "" \
            "This repository's own CI runs again here. Approve, and auto-merge lands it." \
            > /tmp/pr-body.md

          gh pr create \
            --repo fuhdan/netscanner \
            --base main \
            --head "$BRANCH" \
            --title "sync: update plugins from netscanner-plugins" \
            --body-file /tmp/pr-body.md

          gh pr merge "$BRANCH" --repo fuhdan/netscanner \
            --auto --squash --delete-branch \
          || echo "::warning::Auto-merge could not be queued. Is 'Allow auto-merge' enabled on fuhdan/netscanner? The pull request is open and can be merged by hand."
